[package]
name = "paste"
version = "0.2.1"
edition = "2021"
description = "macOS Paste-quality clipboard manager with text expansion for Linux"
license = "MIT"

[lib]
name = "paste_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
rusqlite = { version = "0.39", features = ["bundled-full"] }
evdev = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", features = ["serde"] }
image = "0.25"
sha2 = "0.10"
toml = "0.8"
dirs = "5"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
serde_yaml = "0.9"

# Same versions Tauri already builds against (see Cargo.lock), so this adds no
# new compilation units — it only exposes the GTK window so the overlay can be
# presented with a timestamp. See #114.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"


[features]
# Production builds must embed the frontend (custom-protocol); without it the
# binary points at the vite devUrl. `tauri dev` passes --no-default-features.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]
